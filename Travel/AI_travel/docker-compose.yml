version: '3.8'

services:
  # MySQL 8.0.30
  mysql:
    image: mysql:8.0.30
    container_name: travel_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travel_ai
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql

  # Redis 7.0.15
  redis:
    image: redis:7.0.15
    container_name: travel_redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data


  # ========== RocketMQ 相关服务 ==========
  # RocketMQ NameServer (路由中心/注册中心)
  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: travel_rocketmq_namesrv
    ports:
      - "9876:9876"
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    command: sh mqnamesrv
    restart: always

  # RocketMQ Broker (消息代理/存储节点)
  broker:
    image: apache/rocketmq:5.3.2
    container_name: travel_rocketmq_broker
    user: root
    depends_on:
      - namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
      - "8081:8081"
    volumes:
      - ./conf/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
#      - rocketmq_broker_logs:/home/rocketmq/logs
#      - rocketmq_broker_store:/home/rocketmq/store
      - ./data/rocketmq/logs:/home/rocketmq/logs
      - ./data/rocketmq/store:/home/rocketmq/store
    environment:
      - JAVA_OPT=-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m
      - NAMESRV_ADDR=namesrv:9876
    command: sh mqbroker -n namesrv:9876 --enable-proxy
    restart: always

  # RocketMQ Dashboard (Web 控制台)
  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: travel_rocketmq_dashboard
    depends_on:
      - namesrv
    ports:
      - "8088:8082"
    environment:
      - NAMESRV_ADDR=namesrv:9876
    restart: always

    # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: travel_qdrant
    ports:
      - "6333:6333"      # HTTP API 端口
      - "6334:6334"      # gRPC 端口（可选）
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: always

  # ========== 可观测性服务 ==========

  # ========== Elasticsearch 搜索引擎 ==========
  # 单节点模式（演示够用），开启后供 Java 端 ElasticsearchClient 连接
  # 关闭鉴权 xpack.security.enabled=false，对应 application.yml 中无用户名密码
  # 国内环境：使用阿里云镜像 registry.cn-hangzhou.aliyuncs.com/elastic/...
  # 海外环境：改回 docker.elastic.co/elasticsearch/elasticsearch:8.13.4
  elasticsearch:
    image: registry.cn-hangzhou.aliyuncs.com/elastic/elasticsearch:8.13.4
    container_name: travel_elasticsearch
    environment:
      # 单节点发现模式（无需选举 master）
      - discovery.type=single-node
      # 关闭安全模块（演示阶段；生产环境务必开启 xpack + TLS）
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      # JVM 堆大小：最小=最大避免动态扩缩，512MB 演示够用
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # 锁定堆内存（需配合 ulimits.memlock）
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"      # HTTP API（Java 端连接的端口）
      - "9300:9300"      # 节点间通信（单节点用不到，保留备用）
    volumes:
      # ES 数据持久化
      - es_data:/usr/share/elasticsearch/data
      # IK + Pinyin 插件目录（需先放入 es-scripts/plugins/ 下）
      - ./es-scripts/plugins:/usr/share/elasticsearch/plugins
      # 自定义 ES 配置文件
      - ./es-scripts/es-config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    healthcheck:
      # 集群健康状态为 green 或 yellow 视为健康
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'green|yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Kibana 可视化界面（依赖 ES 启动完成）
  # 国内环境：使用阿里云镜像 registry.cn-hangzhou.aliyuncs.com/elastic/...
  # 海外环境：改回 docker.elastic.co/kibana/kibana:8.13.4
  kibana:
    image: registry.cn-hangzhou.aliyuncs.com/elastic/kibana:8.13.4
    container_name: travel_kibana
    depends_on:
      elasticsearch:
        # 等 ES healthcheck 通过后再启动 Kibana
        condition: service_healthy
    environment:
      # 告诉 Kibana 去哪找 ES
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Kibana 中文界面
      - i18n.locale=zh-CN
    ports:
      - "5601:5601"      # Kibana Web UI
    restart: unless-stopped

  # Prometheus 时序数据库（采集 Java 服务 metrics）
  prometheus:
    image: prom/prometheus:latest
    container_name: travel_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./travel-all-in-one/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana 可视化大盘
  grafana:
    image: grafana/grafana:latest
    container_name: travel_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_dashboards:/etc/grafana/provisioning/dashboards
      - grafana_datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  rocketmq_namesrv_logs:
  rocketmq_broker_logs:
  rocketmq_broker_store:
  qdrant_storage:
  prometheus_data:
  grafana_dashboards:
  grafana_datasources:
  # Elasticsearch 数据持久化卷（重启容器数据不丢）
  es_data:

