# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml


knife4j:
  enable: true


jwt:
  # 密钥（至少32位，建议使用 base64 编码后的字符串）
  secret: bXlTZWNyZXRLZXlGb3JKV1RIUzI1NklzU2FmZUFuZExvbmdFbm91Z2g=
  expiration: 3600000  # 过期时间（毫秒）


# 自定义配置
travel:
  mq:
    content-topic: travel-content-exchange  # 对话内容提交  Topic
    task-topic: travel-task-exchange  # 任务结果 Topic
    result-topic: travel-result-exchange
    content-tag: content-exchange
    task-tag: task-exchange
    result-tag: result-exchange
  security:
    sign-secret: ${SIGN_SECRET:defaultSecret123456}  # MQ消息签名密钥
  python-api-url: http://localhost:8000/api  # Python FastAPI 服务地址
  signature:
    # Java调用Python时使用的密钥（需与Python端一致）
    secret-key-java: ${SIGN_KEY_JAVA:travel-java-secret-key-2026}
    # Python回调Java时使用的密钥（需与Python端一致）
    secret-key-python: ${SIGN_KEY_PYTHON:travel-python-secret-key-2026}
