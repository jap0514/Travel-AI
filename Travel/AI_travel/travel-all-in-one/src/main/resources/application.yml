server:
  port: 9999

spring:
  profiles:
    active: dev
  application:
    name: travel-java  # 应用名称，用于链路追踪
  # 数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.71.140:3306/travel_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  # Redis
  data:
    redis:
      host: 192.168.71.140
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8    # 连接池最大连接数
          max-idle: 8      # 连接池最大空闲连接
          min-idle: 0      # 连接池最小空闲连接
          max-wait: 3000ms # 连接池最大阻塞等待时间

  mvc:
    throw-exception-if-no-handler-found: true  # 设置为true后，就会在找不到对应的controller之后抛出NoHandlerFoundException异常。如果保持默认的false，找不到controller后就会返回404状态码，而不是抛异常。
  web:
    resources:
      add-mappings: false  # 因为是先处理静态资源的请求，再找匹配的controller。如果不设置为false的话，就会先匹配静态资源，匹配不上就会返回404状态码了，就根本到不了下一步的匹配controller，也就无法抛异常了。

# Actuator + Micrometer 配置（可观测性）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics  # 暴露的端点
      base-path: /actuator  # 端点基础路径
  endpoint:
    health:
      show-details: always  # 健康检查显示详情
    prometheus:
      enabled: true  # 开启 Prometheus 端点
  metrics:
    tags:
      application: ${spring.application.name}  # 给所有指标添加应用名标签
    distribution:
      percentiles-histogram:
        http.server.requests: true  # 开启请求耗时的百分位直方图
      percentiles:
        http.server.requests: 0.5,0.90,0.95,0.99  # p50, p90, p95, p99

rocketmq:
  name-server: 192.168.71.140:9876
  producer:
    group: travel-content-producer-group  # 内容生产者组
    send-message-timeout: 3000
    retry-times-when-send-failed: 2      # 失败自动重试
    retry-times-when-send-async-failed: 2
  consumer:
    group: travel-task-consumer-group
    message-model: CLUSTERING
    ack-mode: MANUAL                     # 手动确认
    consume-thread-min: 1
    consume-thread-max: 5


